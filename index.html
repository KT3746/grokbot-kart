<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07080c" />
    <meta
      name="description"
      content="KART — corrida de kart original no navegador. Asfalto, drift e caos justo."
    />
    <title>KART</title>
    <style id="touch-lock">
      @media (max-width: 819px) {
        body.is-race #touch,
        body.is-race .touch {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
        }
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui"></div>
      <div id="webgl-fail" class="webgl-fail" hidden role="alert">
        <div class="webgl-fail-panel">
          <p class="eyebrow">KART</p>
          <h1>Sem WebGL</h1>
          <p>Erro: WebGL indisponível. Atualize o navegador ou ative a aceleração gráfica.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
